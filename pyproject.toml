# ---------------- #
# Project Metadata #
# ---------------- #
[project]
name = "plot-publisher"
description = "A utility to publish plotly plots to a live data server."
dynamic = ["version"]
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["neutrons", "plotting", "live-data"]
readme = "README.md"
dependencies = [
  "requests>2.0.0",
  "plotly>5.0.0",
]

[project.urls]
homepage = "https://github.com/neutrons/plot_publisher/"
repository = "https://github.com/neutrons/plot_publisher/"
issues = "https://github.com/neutrons/plot_publisher/issues"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
]
docs = [
  "sphinx>=8.2.1,<9",
  "sphinx_rtd_theme>=3.0.1,<4",
  "versioningit",
  "myst_parser",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "versioningit"]

# ---------------------------- #
# Hatch & Versioningit Config #
# ---------------------------- #
[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "src/plot_publisher/_version.py"
build-file = "plot_publisher/_version.py"
replacement = '"{next_version}"'

[tool.hatch.build]
artifacts = [
  "src/plot_publisher/_version.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plot_publisher"]

[tool.versioningit.vcs]
method = "git"
default-tag = "0.1.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
# Since pixi builds currently require the package version to be set statically in pyproject.toml,
# and we solve that by temporarily changing pyproject.toml during build using the pixi tasks
# sync-version and reset-toml, then we need to ignore uncommitted changes in order for the wheel
# version to be consistent with the package version
dirty = "{version}"
distance-dirty = "{next_version}.dev{distance}"

[tool.versioningit.write]
file = "src/plot_publisher/_version.py"

# ---------------- #
# Pytest Config    #
# ---------------- #
[tool.pytest.ini_options]
addopts = "-v --cov=src/plot_publisher --cov-report=term-missing --cov-report=xml"
pythonpath = [
  ".", "src"
]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = [".git", "tmp*", "_tmp*", "__pycache__", "*dataset*", "*data_set*"]
markers = [
    "mymarker: example markers goes here"
]

# ---------------- #
# Ruff Linting     #
# ---------------- #
[tool.ruff]
target-version = "py39"
line-length = 120
select = ["A", "ARG","ASYNC","BLE","C90", "E", "F", "I", "N", "UP032", "W"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["plot_publisher"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------- #
# Pixi Config      #
# ---------------- #
[tool.pixi.workspace]
preview = ["pixi-build"]  # Required until the build feature becomes stable
channels = [
  "conda-forge",
  "https://prefix.dev/pixi-build-backends",  # Required for pixi build
]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.environments]
default = {features = ["test", "package", "docs", "developer"], solve-group = "default"}

[tool.pixi.pypi-dependencies]
plot-publisher = { path = ".", editable = true }
toml-cli = "*"  # Required for sync-version task

[tool.pixi.dependencies]
python = ">=3.9"
numpy = "*"
requests = "*"
plotly = "*"

# Pixi Build configuration for conda packaging
[tool.pixi.package.host-dependencies]
hatchling = "*"
versioningit = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.9"
numpy = "*"
requests = "*"
plotly = "*"

[tool.pixi.package]
name = "plot-publisher"
version = "0.0.0"  # placeholder, overwritten by sync-version

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "0.1.*" }

# --------------- #
# Pixi Tasks      #
# --------------- #
[tool.pixi.tasks]
# General
lint = { cmd = "pre-commit run --all-files", description = "Lint the project" }
test = { cmd = "pytest", description = "Run the tests" }
# Build - Python Project Template approach
sync-version = 'version=$(python -m versioningit); toml set tool.pixi.package.version "$version" --toml-path pyproject.toml'
backup-toml = "cp pyproject.toml pyproject.toml.bak"
reset-toml = "cp pyproject.toml.bak pyproject.toml; rm pyproject.toml.bak"
conda-build-command = "pixi build"
conda-build = { description = "Build the conda package", depends-on = [
  "backup-toml",
  "sync-version",
  "conda-build-command",
  "reset-toml",
] }
build-pypi = { cmd = "hatch build", description = "Build the package for PyPI" }
build = {depends-on = ["conda-build", "build-pypi"]}
# Docs
docs = {depends-on = ["build-docs"]}
build-docs = { cmd = "sphinx-build -b html docs docs/_build", description = "Build the documentation" }
serve-docs = { cmd = "sphinx-autobuild docs docs/_build", description = "Serve the documentation" }
# Release
conda-publish = { cmd = "anaconda upload *.conda", description = "Publish the package to anaconda.org", depends-on = ["conda-build"] }
publish-pypi = { cmd = "twine upload dist/*", description = "Publish the package to PyPI", depends-on = ["build-pypi"] }
release = {depends-on = ["build", "publish-pypi", "conda-publish"]}
# Housekeeping
clean-conda = { cmd = "rm -f *.conda", description = "Clean the conda build artifacts" }
clean-pypi = { cmd = "rm -rf dist", description = "Clean the PyPI build artifacts" }
clean-docs = { cmd = "rm -rf docs/_build", description = "Clean the documentation build artifacts" }
clean-build = { cmd = "rm -rf build", description = "Clean the build artifacts" }
clean = {depends-on = ["clean-conda", "clean-pypi", "clean-docs", "clean-build"]}

# ------------------------------- #
# Pixi Feature Dependencies       #
# ------------------------------- #
[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"

[tool.pixi.feature.package.dependencies]
twine = ">=6.1.0,<7"
hatch = "*"
anaconda-client = "*"

[tool.pixi.feature.developer.dependencies]
pip = "*"
versioningit = "*"
pre-commit = "*"
ruff = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=8.2.1,<9"
sphinx_rtd_theme = ">=3.0.1,<4"
myst-parser = "*"
versioningit = "*"
