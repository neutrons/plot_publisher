[project]
name = "plot-publisher"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.9"
plotly = "*"
requests = "*"
numpy = "*"
pytest = "*"
pytest-cov = "*"
pre-commit = "*"

[tasks]
test = "pytest tests/ --cov=src/plot_publisherpy --cov-report=xml --cov-report=term-missing"
lint = "pre-commit run --all-files"
install-dev = "pip install -e ." 