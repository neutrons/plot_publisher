# ---------------- #
# Project Metadata #
# ---------------- #
[project]
name = "plot-publisher"
description = "A utility to publish plotly plots to a live data server."
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["neutrons", "plotting", "live-data"]
readme = "README.md"
dependencies = [
  "requests>2.0.0",
  "plotly>5.0.0",
]

[project.urls]
homepage = "https://github.com/neutrons/plot_publisher/"
repository = "https://github.com/neutrons/plot_publisher/"
issues = "https://github.com/neutrons/plot_publisher/issues"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
]
docs = [
  "sphinx>=8.2.1,<9",
  "sphinx_rtd_theme>=3.0.1,<4",
  "versioningit",
  "myst_parser",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "versioningit"]

# ---------------------------- #
# Hatch & Versioningit Config #
# ---------------------------- #
[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "src/plot_publisher/_version.py"
build-file = "plot_publisher/_version.py"
replacement = '"{next_version}"'

[tool.hatch.build]
artifacts = [
  "src/plot_publisher/_version.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plot_publisher"]

[tool.versioningit.vcs]
method = "git"
default-tag = "0.1.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
dirty = "{version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+d{build_date:%Y%m%d%H%M}"

[tool.versioningit.write]
file = "src/plot_publisher/_version.py"

# ---------------- #
# Pytest Config    #
# ---------------- #
[tool.pytest.ini_options]
addopts = "-v --cov=src/plot_publisher --cov-report=term-missing --cov-report=xml"
pythonpath = [
  ".", "src"
]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = [".git", "tmp*", "_tmp*", "__pycache__", "*dataset*", "*data_set*"]
markers = [
    "mymarker: example markers goes here"
]

# ---------------- #
# Ruff Linting     #
# ---------------- #
[tool.ruff]
target-version = "py310"
line-length = 120
select = ["A", "ARG","ASYNC","BLE","C90", "E", "F", "I", "N", "UP032", "W"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["plot_publisher"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------- #
# Pixi Config      #
# ---------------- #
[tool.pixi.project]
channels = [
  "conda-forge",
]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.environments]
default = {features = ["test", "package", "docs", "developer"], solve-group = "default"}

[tool.pixi.pypi-dependencies]
plot-publisher = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.10"
numpy = "*"
requests = "*"
plotly = "*"

# --------------- #
# Pixi Tasks      #
# --------------- #
[tool.pixi.tasks]
# General
lint = { cmd = "pre-commit run --all-files", description = "Lint the project" }
test = { cmd = "pytest", description = "Run the tests" }
# Build
build = {depends-on = ["build-conda", "build-pypi"]}
build-conda = { cmd = "pixi run build-pypi && rattler-build build --recipe recipe/recipe.yaml", description = "Build the conda package" }
build-pypi = { cmd = "hatch build", description = "Build the package for PyPI" }
# Docs
docs = {depends-on = ["build-docs"]}
build-docs = { cmd = "sphinx-build -b html docs docs/_build", description = "Build the documentation" }
serve-docs = { cmd = "sphinx-autobuild docs docs/_build", description = "Serve the documentation" }
# Release
release = {depends-on = ["build", "publish-pypi", "publish-conda"]}
publish-pypi = { cmd = "twine upload dist/*", description = "Publish the package to PyPI" }
publish-conda = { cmd = "pixi upload conda-upload", description = "Publish the package to anaconda.org" }
# Housekeeping
clean = {depends-on = ["clean-pypi", "clean-docs", "clean-build"]}
clean-pypi = { cmd = "rm -rf dist", description = "Clean the PyPI build artifacts" }
clean-docs = { cmd = "rm -rf docs/_build", description = "Clean the documentation build artifacts" }
clean-build = { cmd = "rm -rf build", description = "Clean the build artifacts" }

# ------------------------------- #
# Pixi Feature Dependencies       #
# ------------------------------- #
[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"

[tool.pixi.feature.package.dependencies]
rattler-build = "*"
twine = ">=6.1.0,<7"
hatch = "*"

[tool.pixi.feature.developer.dependencies]
pip = "*"
versioningit = "*"
pre-commit = "*"
ruff = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=8.2.1,<9"
sphinx_rtd_theme = ">=3.0.1,<4"
myst-parser = "*"
versioningit = "*"
